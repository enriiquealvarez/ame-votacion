<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vota por tu Taquiza · AME Catering</title>
<meta name="description" content="Elige tus guisados y agua fresca favoritos. Resultados en vivo · cierra el miércoles 25 de noviembre.">
<meta property="og:type" content="website">
<meta property="og:title" content="🌮 ¡Vota por tu Taquiza Gourmet! · AME Catering">
<meta property="og:description" content="Elige tus favoritos y mira los resultados en vivo. Cierra el miércoles 25 de noviembre.">
<meta property="og:image" content="{{BASE}}/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{BASE}}/">
<meta name="theme-color" content="#8e1f45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Great+Vibes&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#8e1f45;--wine-d:#6c1433;--rose:#e9a3b8;--blush:#fbe9ee;--paper:#fff8f9;--ink:#4a1a2b;--muted:#8a6070;--gold:#c9973c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Lato,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fdeef2 0%,#fff8f9 40%,#fdeef2 100%);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 120px}
header{text-align:center;padding:18px 8px 8px}
.brand{font-family:'Playfair Display',serif;font-weight:800;font-size:46px;color:var(--wine);letter-spacing:2px;line-height:1}
.brand-s{font-family:'Great Vibes',cursive;font-size:34px;color:#c45d7f;margin-top:-6px}
h1{font-family:'Playfair Display',serif;font-size:30px;color:var(--wine);margin-top:14px;line-height:1.1}
.tag{letter-spacing:4px;font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase}
.hero{margin:18px 0 6px;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(142,31,69,.18)}
.hero img{width:100%;display:block}
.count{display:flex;justify-content:center;gap:8px;margin:18px 0 4px}
.count div{background:#fff;border:1px solid #f3cbd7;border-radius:12px;min-width:66px;padding:8px 4px;text-align:center}
.count b{display:block;font-family:'Playfair Display',serif;font-size:26px;color:var(--wine)}
.count span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.dl{text-align:center;font-size:13px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--wine);background:#fff;border:1px solid #f3cbd7;padding:4px 10px;border-radius:99px;margin-top:10px}
.live i{width:8px;height:8px;border-radius:50%;background:#e0245e;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.tabs{display:flex;background:#fff;border:1px solid #f3cbd7;border-radius:99px;padding:4px;margin:22px 0 14px;position:sticky;top:8px;z-index:5;box-shadow:0 4px 14px rgba(142,31,69,.08)}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:99px;font:700 14px Lato,sans-serif;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--wine);color:#fff}
.card{background:#fff;border:1px solid #f3cbd7;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(142,31,69,.06)}
.card h2{font-family:'Playfair Display',serif;font-size:20px;color:var(--wine);display:flex;align-items:center;gap:10px;margin-bottom:4px}
.card h2 .ic{width:38px;height:38px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-size:20px}
.card .hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid #f0c3d1;background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:99px;font:600 15px Lato,sans-serif;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--rose)}
.opt.sel{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:0 4px 12px rgba(142,31,69,.3)}
.opt.sel::before{content:'♥ '}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,248,249,.96);backdrop-filter:blur(8px);border-top:1px solid #f3cbd7;z-index:10}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.prog{font-size:13px;color:var(--muted);white-space:nowrap}
.btn{flex:1;border:0;border-radius:14px;padding:15px;font:800 16px Lato,sans-serif;background:var(--wine);color:#fff;cursor:pointer}
.btn:disabled{background:#d9b3c0;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--wine);border:1.5px solid var(--wine)}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font:800 16px Lato,sans-serif;padding:15px;border-radius:14px;margin:6px 0 14px}
.res-row{margin:10px 0}
.res-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.res-top .n{color:var(--muted);white-space:nowrap}
.res-row.lead .res-top b{color:var(--wine)}
.track{height:12px;background:var(--blush);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--wine));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.res-row.mine .res-top b::after{content:' · tu voto';font-weight:400;color:var(--muted);font-size:12px}
.total{text-align:center;font-size:14px;color:var(--muted);margin:4px 0 14px}
.total b{color:var(--wine);font-size:18px}
.winner{text-align:center;padding:22px 16px;background:linear-gradient(160deg,#fff,#fdeef2);border:1.5px solid var(--gold)}
.winner .cat{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.winner .w{font-family:'Playfair Display',serif;font-size:26px;color:var(--wine);margin:6px 0 2px}
.winner .v{font-size:13px;color:var(--muted)}
.closed-banner{text-align:center;background:var(--wine);color:#fff;border-radius:18px;padding:20px 16px;margin:18px 0}
.closed-banner h3{font-family:'Playfair Display',serif;font-size:24px}
.closed-banner p{opacity:.85;font-size:14px;margin-top:4px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-300%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.3s;z-index:20;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.thanks{text-align:center;padding:24px 16px}
.thanks .big{font-size:44px}
.thanks h3{font-family:'Playfair Display',serif;color:var(--wine);font-size:24px;margin:6px 0}
.thanks p{color:var(--muted);font-size:14px}
footer{text-align:center;font-family:'Great Vibes',cursive;font-size:26px;color:#c45d7f;margin-top:26px}
.hide{display:none!important}
.loading{text-align:center;color:var(--muted);padding:30px}

/* ---------- pantalla final ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.preview-tag{background:#fff3cd;color:#7a5a00;border:1px solid #f0d78c;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;margin:14px 0}
.combo{background:linear-gradient(150deg,var(--wine),#b8456d);color:#fff;border-radius:22px;padding:22px 18px;margin:16px 0;box-shadow:0 14px 34px rgba(142,31,69,.35);position:relative;overflow:hidden}
.combo::after{content:'🌮';position:absolute;right:-10px;bottom:-24px;font-size:120px;opacity:.12;transform:rotate(-15deg)}
.combo h3{font-family:'Playfair Display',serif;font-size:24px;text-align:center}
.combo .sub{text-align:center;font-size:13px;opacity:.85;margin:4px 0 14px}
.combo-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-top:8px;opacity:0;transform:translateY(12px);animation:up .5s forwards}
.combo-row .ci{font-size:26px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.combo-row .cc{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.combo-row .cw{font-family:'Playfair Display',serif;font-size:19px;line-height:1.15}
.combo-row .cv{margin-left:auto;text-align:right;font-weight:800;font-size:18px;white-space:nowrap}
.combo-row .cv small{display:block;font-weight:400;font-size:11px;opacity:.8}
@keyframes up{to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.stat{background:#fff;border:1px solid #f3cbd7;border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:22px;color:var(--wine);line-height:1.1}
.stat span{font-size:11px;color:var(--muted);display:block;margin-top:4px}
.stat em{font-style:normal;font-size:12px;color:var(--ink);display:block;margin-top:2px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid #f0c3d1;background:#fff;border-radius:99px;padding:8px 14px;font:700 14px Lato,sans-serif;color:var(--muted);cursor:pointer}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 6px;min-height:200px}
.pod{flex:1;max-width:150px;text-align:center}
.pod .pname{font-weight:800;font-size:13px;color:var(--ink);margin-bottom:6px;min-height:34px;display:flex;align-items:flex-end;justify-content:center;line-height:1.2}
.pod .pblock{border-radius:14px 14px 4px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;height:0;transition:height .9s cubic-bezier(.2,.9,.2,1)}
.pod .medal{font-size:28px}
.pod .pv{font-weight:800;font-size:15px;margin-top:2px}
.pod.p1 .pblock{background:linear-gradient(180deg,#d9a441,#b98222)}
.pod.p2 .pblock{background:linear-gradient(180deg,#b9b9c3,#8f8f9c)}
.pod.p3 .pblock{background:linear-gradient(180deg,#d29468,#a96a3f)}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
table.rt th{text-align:left;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1.5px solid #f3cbd7;cursor:pointer;user-select:none;white-space:nowrap}
table.rt th.sorted{color:var(--wine)}
table.rt td{padding:9px 6px;border-bottom:1px solid #f8e1e8;vertical-align:middle}
table.rt tr{opacity:0;animation:up .4s forwards}
table.rt tr.top td{background:#fff7e6}
table.rt tr.mine td:nth-child(2)::after{content:' · tu voto';color:var(--muted);font-size:11px}
table.rt tr:hover td{background:var(--blush)}
.rk{font-weight:800;color:var(--wine);width:34px;text-align:center}
.cat-pill{font-size:16px}
.mini{height:8px;background:var(--blush);border-radius:99px;overflow:hidden;margin-top:4px;min-width:60px}
.mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--wine));border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.pct{font-weight:800;color:var(--wine);white-space:nowrap;text-align:right}
.actions{display:flex;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.actions .btn{min-width:150px}
body.present{font-size:18px}
body.present .wrap{max-width:1000px}
body.present header,body.present .hero,body.present #countBox,body.present .wa,body.present footer{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">AME</div>
    <div class="brand-s">Catering</div>
    <h1>¡Vota por tu Taquiza Gourmet!</h1>
    <div class="tag">Sabor · Tradición · En tu evento</div>
  </header>

  <div class="hero"><img src="/menu.jpg" alt="Menú Taquizas Gourmet de AME Catering"></div>

  <div id="countBox">
    <div class="count" id="count"></div>
    <div class="dl" id="dlText"></div>
  </div>
  <div style="text-align:center"><span class="live" id="liveTag"><i></i> Resultados en vivo</span></div>

  <div id="closedBanner" class="closed-banner hide">
    <h3>🏆 ¡Votación cerrada!</h3>
    <p>Estos son los ganadores de la Taquiza Gourmet</p>
  </div>

  <div class="tabs" id="tabs">
    <button data-t="vote" class="on">🗳️ Votar</button>
    <button data-t="res">📊 Resultados</button>
  </div>

  <div id="vote"><div class="loading">Cargando menú…</div></div>
  <div id="res" class="hide"></div>

  <a class="wa" id="waBtn" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.3z"/></svg>
    Compartir por WhatsApp
  </a>

  <footer>Hacemos de cada evento una experiencia para disfrutar ♥</footer>
</div>

<div class="bar" id="bar">
  <div class="in">
    <span class="prog" id="prog">0 / 4</span>
    <button class="btn" id="send" disabled>Enviar mi voto</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script>
const $ = s => document.querySelector(s);
let S = null;            // estado del servidor
let picks = {};          // selección local
let editing = false;
let tab = 'vote';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }

function setTab(t){
  tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#vote').classList.toggle('hide',t!=='vote');
  $('#res').classList.toggle('hide',t!=='res');
  renderBar();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

function renderCountdown(){
  if(!S) return;
  const ms = new Date(S.deadline) - Date.now();
  const d = new Date(S.deadline);
  if(ms<=0){
    $('#count').innerHTML=''; $('#dlText').textContent='La votación cerró el '+d.toLocaleString('es-MX',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'America/Mexico_City'});
    if(!S.closed){ S.closed=true; renderAll(); }
    return;
  }
  const u=[['días',864e5],['horas',36e5],['min',6e4],['seg',1e3]]; let r=ms;
  $('#count').innerHTML=u.map(([n,v])=>{const q=Math.floor(r/v); r-=q*v; return `<div><b>${String(q).padStart(2,'0')}</b><span>${n}</span></div>`}).join('');
  $('#dlText').textContent='Cierra el miércoles 25 de noviembre a las 11:59 pm';
}
setInterval(renderCountdown,1000);

function leaders(cat){
  const c=S.counts[cat.id]; const max=Math.max(...Object.values(c));
  return { max, names: max>0 ? Object.keys(c).filter(k=>c[k]===max) : [] };
}

function renderVote(){
  const box=$('#vote');
  if(S.closed){ box.innerHTML=''; return; }
  if(S.mine && !editing){
    box.innerHTML=`<div class="card thanks"><div class="big">🌮</div><h3>¡Gracias por votar!</h3>
      <p>Tu voto: ${S.menu.map(c=>`<b>${esc(S.mine[c.id])}</b>`).join(' · ')}</p>
      <p style="margin-top:10px">Puedes cambiarlo hasta el cierre.</p>
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" id="edit">Cambiar mi voto</button><button class="btn" id="seeRes">Ver resultados</button></div></div>`;
    $('#edit').onclick=()=>{editing=true; picks={...S.mine}; renderVote(); renderBar();};
    $('#seeRes').onclick=()=>setTab('res');
    return;
  }
  box.innerHTML=S.menu.map(c=>`<div class="card"><h2><span class="ic">${c.icon}</span>${esc(c.title)}</h2>
    <div class="hint">Elige tu favorito</div>
    <div class="opts">${c.options.map(o=>`<button class="opt${picks[c.id]===o?' sel':''}" data-c="${c.id}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`).join('');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    picks[b.dataset.c]=b.dataset.o;
    b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
    renderBar();
    const cards=[...box.querySelectorAll('.card')]; const i=S.menu.findIndex(c=>c.id===b.dataset.c);
    if(cards[i+1] && !picks[S.menu[i+1].id]) setTimeout(()=>cards[i+1].scrollIntoView({behavior:'smooth',block:'center'}),180);
  });
}

function renderRes(){
  const box=$('#res');
  let html=`<div class="total"><b>${S.total}</b> ${S.total===1?'persona ha votado':'personas han votado'}</div>`;
  if(S.closed || preview){ renderFinal(box); return; }
  html+=S.menu.map(c=>{
    const cnt=S.counts[c.id]; const sum=Object.values(cnt).reduce((a,b)=>a+b,0)||1; const L=leaders(c);
    const rows=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
    return `<div class="card"><h2><span class="ic">${c.icon}</span>${esc(c.title)}</h2>${rows.map(([o,n])=>`
      <div class="res-row${L.names.includes(o)?' lead':''}${S.mine&&S.mine[c.id]===o?' mine':''}">
        <div class="res-top"><b>${L.names.includes(o)?'🏆 ':''}${esc(o)}</b><span class="n">${n} · ${Math.round(n*100/sum)}%</span></div>
        <div class="track"><div class="fill" style="width:${n*100/sum}%"></div></div></div>`).join('')}</div>`;
  }).join('');
  box.innerHTML=html;
}

function renderBar(){
  const show = S && !S.closed && tab==='vote' && (!S.mine || editing);
  $('#bar').classList.toggle('hide',!show);
  $('.wrap').style.paddingBottom = show ? '120px' : '40px';
  if(!S) return;
  const n=S.menu.filter(c=>picks[c.id]).length;
  $('#prog').textContent=`${n} / ${S.menu.length}`;
  $('#send').disabled = n<S.menu.length;
  $('#send').textContent = n<S.menu.length ? `Elige ${S.menu.length-n} más` : (editing?'Guardar cambio':'Enviar mi voto');
}

function renderAll(){
  $('#closedBanner').classList.toggle('hide',!S.closed);
  $('#tabs').classList.toggle('hide',S.closed);
  if(S.closed) $('#liveTag').innerHTML='🏆 Resultados finales';
  if(S.closed) setTab('res');
  renderVote(); renderRes(); renderBar(); renderCountdown();
}

$('#send').onclick=async()=>{
  const b=$('#send'); b.disabled=true; b.textContent='Enviando…';
  try{
    const r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(picks),credentials:'same-origin'});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'No se pudo registrar');
    S=j; editing=false; toast('¡Voto registrado! 🌮'); renderAll(); setTab('res'); window.scrollTo({top:$('#tabs').offsetTop-10,behavior:'smooth'});
  }catch(e){ toast(e.message); renderBar(); }
};

const shareText = '🌮 ¡Ayúdanos a elegir la Taquiza Gourmet de AME Catering! Vota por tus guisados y agua fresca favoritos y mira los resultados en vivo. Cierra el miércoles 25 de noviembre 👉 ';
$('#waBtn').href='https://wa.me/?text='+encodeURIComponent(shareText+location.origin+'/');


// ---------- pantalla final interactiva ----------
let preview=false, finalCat='all', sortBy={k:'v',d:-1}, confettiDone=false;

function ranked(cat){
  const cnt=S.counts[cat.id]; const sum=Object.values(cnt).reduce((a,b)=>a+b,0);
  const rows=Object.entries(cnt).map(([o,v])=>({o,v,cat,p:sum?v*100/sum:0})).sort((a,b)=>b.v-a.v||a.o.localeCompare(b.o));
  let rank=0,last=null; rows.forEach((r,i)=>{ if(r.v!==last){rank=i+1; last=r.v;} r.r=rank; });
  return rows;
}

function renderFinal(box){
  const cats=S.menu, R=Object.fromEntries(cats.map(c=>[c.id,ranked(c)]));
  // estadísticas
  let close=null; cats.forEach(c=>{const r=R[c.id]; if(r[0].v>0){const m=r[0].v-(r[1]?r[1].v:0); if(!close||m<close.m) close={c,m};}});
  let fav=null; cats.forEach(c=>{const r=R[c.id][0]; if(r.v>0&&(!fav||r.p>fav.p)) fav=r;});

  let h='';
  if(preview && !S.closed) h+=`<div class="preview-tag">👀 Vista previa del cierre con los votos actuales. Solo tú la ves.</div>`;
  h+=`<div class="combo"><h3>🏆 La Taquiza ganadora</h3><div class="sub">${S.total} ${S.total===1?'persona votó':'personas votaron'}</div>`+
    cats.map((c,i)=>{const top=R[c.id].filter(r=>r.r===1&&r.v>0);
      return `<div class="combo-row" style="animation-delay:${.15+i*.18}s"><div class="ci">${c.icon}</div><div><div class="cc">${esc(c.title)}</div>
      <div class="cw">${top.length?top.map(t=>esc(t.o)).join(' / '):'Sin votos'}</div></div>
      <div class="cv">${top.length?top[0].v:0}<small>${top.length>1?'empate':(top.length?Math.round(top[0].p)+'%':'')}</small></div></div>`}).join('')+`</div>`;
  h+=`<div class="stats">
    <div class="stat"><b>${S.total}</b><span>votantes</span></div>
    <div class="stat"><b>${fav?Math.round(fav.p)+'%':'—'}</b><span>favorito absoluto</span><em>${fav?esc(fav.o):''}</em></div>
    <div class="stat"><b>${close?(close.m===0?'Empate':'+'+close.m):'—'}</b><span>la más reñida</span><em>${close?close.c.icon+' '+esc(close.c.title):''}</em></div></div>`;
  h+=`<div class="actions"><a class="btn" id="shareRes" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;background:#25d366">Compartir ganadores</a>
      <button class="btn ghost" id="present">${document.body.classList.contains('present')?'Salir de presentación':'Modo presentación'}</button></div>`;
  h+=`<div class="chips"><button class="chip${finalCat==='all'?' on':''}" data-k="all">Todas</button>`+
     cats.map(c=>`<button class="chip${finalCat===c.id?' on':''}" data-k="${c.id}">${c.icon} ${esc(c.title.replace('Guisados de ',''))}</button>`).join('')+`</div>`;

  let rows = finalCat==='all' ? cats.flatMap(c=>R[c.id]) : R[finalCat];
  h+=`<div class="card">`;
  if(finalCat!=='all'){
    const p=rows.filter(r=>r.v>0).slice(0,3), max=p[0]?p[0].v:1, order=[1,0,2];
    h+=`<div class="podium">`+order.map(i=>p[i]?`<div class="pod p${i+1}"><div class="pname">${esc(p[i].o)}</div>
      <div class="pblock" data-h="${[150,110,80][i]*(.55+.45*p[i].v/max)}"><div class="medal">${['🥇','🥈','🥉'][i]}</div><div class="pv">${p[i].v}</div></div></div>`:'<div class="pod"></div>').join('')+`</div>`;
  }
  const dir=sortBy.d, k=sortBy.k;
  rows=[...rows].sort((a,b)=> k==='o'?dir*a.o.localeCompare(b.o) : k==='c'?dir*a.cat.title.localeCompare(b.cat.title)||b.v-a.v : dir*(a.v-b.v)||a.o.localeCompare(b.o));
  const th=(key,label)=>`<th data-s="${key}" class="${k===key?'sorted':''}">${label}${k===key?(dir<0?' ▼':' ▲'):''}</th>`;
  h+=`<table class="rt"><thead><tr><th>#</th>${th('o','Opción')}${finalCat==='all'?th('c','Cat.'):''}${th('v','Votos')}<th style="text-align:right">%</th></tr></thead><tbody>`+
    rows.map((r,i)=>`<tr class="${r.r===1&&r.v>0?'top':''}${S.mine&&S.mine[r.cat.id]===r.o?' mine':''}" style="animation-delay:${Math.min(i*.035,.8)}s">
      <td class="rk">${r.v>0?(r.r===1?'🏆':r.r):'–'}</td><td><b>${esc(r.o)}</b><div class="mini"><i data-w="${r.p}"></i></div></td>
      ${finalCat==='all'?`<td class="cat-pill" title="${esc(r.cat.title)}">${r.cat.icon}</td>`:''}<td><b>${r.v}</b></td><td class="pct">${Math.round(r.p)}%</td></tr>`).join('')+`</tbody></table></div>`;
  box.innerHTML=h;

  // animaciones
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    box.querySelectorAll('.mini i').forEach(e=>e.style.width=e.dataset.w+'%');
    box.querySelectorAll('.pblock').forEach(e=>e.style.height=e.dataset.h+'px');
  }));
  // eventos
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{finalCat=b.dataset.k; if(finalCat!=='all'&&sortBy.k==='c') sortBy={k:'v',d:-1}; renderFinal(box);});
  box.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{const s=t.dataset.s; sortBy= sortBy.k===s?{k:s,d:-sortBy.d}:{k:s,d:s==='v'?-1:1}; renderFinal(box);});
  const txt='🏆 ¡Resultados de la Taquiza Gourmet de AME Catering!\n\n'+cats.map(c=>{const t=R[c.id].filter(r=>r.r===1&&r.v>0);return `${c.icon} ${c.title}: ${t.length?t.map(x=>x.o).join(' / ')+` (${t[0].v} votos)`:'Sin votos'}`}).join('\n')+`\n\n🗳️ ${S.total} personas votaron. ¡Gracias!\n${location.origin}/`;
  $('#shareRes').href='https://wa.me/?text='+encodeURIComponent(txt);
  $('#present').onclick=async()=>{
    const on=!document.body.classList.contains('present');
    document.body.classList.toggle('present',on);
    try{ on?await document.documentElement.requestFullscreen():document.fullscreenElement&&await document.exitFullscreen(); }catch{}
    renderFinal(box); if(on){ confettiDone=false; confetti(); }
  };
  if(!confettiDone){ confettiDone=true; confetti(); }
}
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); renderRes(); }});

function confetti(){
  const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#8e1f45','#e9a3b8','#c9973c','#f6d6e0','#b8456d','#ffffff'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,w:6+Math.random()*6,h:8+Math.random()*8,vx:-1.5+Math.random()*3,vy:2+Math.random()*3.5,r:Math.random()*6,vr:-.2+Math.random()*.4,col:cols[Math.random()*cols.length|0]}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(++t<260) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

// vista previa para el organizador: /?preview=TU_ADMIN_KEY
(async()=>{ const k=new URLSearchParams(location.search).get('preview'); if(!k) return;
  try{ const r=await (await fetch('/api/check?key='+encodeURIComponent(k))).json();
    if(r.ok){ preview=true; const w=setInterval(()=>{ if(S){ clearInterval(w); setTab('res'); renderRes(); setTimeout(()=>$('#tabs').scrollIntoView({behavior:'smooth'}),400); } },100); } else toast('Clave de vista previa incorrecta'); }catch{} })();

async function init(){
  try{
    S=await (await fetch('/api/state',{credentials:'same-origin'})).json();
    if(S.mine) picks={...S.mine};
    renderAll();
  }catch{ $('#vote').innerHTML='<div class="loading">No se pudo cargar. Recarga la página.</div>'; }
  const es=new EventSource('/api/stream');
  es.onmessage=e=>{ const d=JSON.parse(e.data); if(!S) return; const wasClosed=S.closed; Object.assign(S,d);
    renderRes(); if(d.closed && !wasClosed) renderAll(); };
}
init();
</script>
